--host=wasm32-local-emscripten
--enable-qt5
--disable-gen
--disable-scripting
--with-package-format=emscripten
# en-US only for the Collabora-base build validation. The de/es/fr
# langpacks (online task #193) need the translations submodule at
# Collabora's co-25.04 commit, which lives on git.libreoffice.org
# (unreachable from this CI) and is absent from the github mirror.
# Re-add langpacks by repointing the translations submodule to a
# reachable upstream commit that carries de/es/fr once the base builds.
--with-lang=en-US
