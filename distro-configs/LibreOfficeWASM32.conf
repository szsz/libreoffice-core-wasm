--host=wasm32-local-emscripten
--enable-qt5
--disable-gen
--disable-scripting
--with-package-format=emscripten
# Pack non-en-US langpacks so cool-online users can switch UI lang
# (online task #193). Conservative starter set — adding 4 langpacks
# adds ~30 MB to lo-core.tar.zst (currently ~705 MB compressed).
# Expand to --with-lang=ALL if more locales are needed; risk is
# strictly WASM bundle size + cold-load time, not build failure
# (LibreOfficeOnline.conf uses --with-lang=ALL successfully on
# desktop online).
--with-lang=de en-US es fr
# Bundle hunspell dictionaries for the same 4 langs so spell-check
# (red squiggle) works out-of-the-box. SpellChecker::getLocales()
# in lingucomponent reads from SvtLinguConfig which is configmgr
# backed; in WASM mode configmgr only reads pre-built bundles so
# runtime extension installation (dict-loader.js writing files
# to /instdir/share/extensions/dict-<lang>/) doesn't reach the
# lingu service. Adding --with-myspell-dicts triggers the
# dictionaries submodule fetch and bakes the .dic/.aff + the
# dictionaries.xcu registration into configmgr's pre-built bundle.
# Pairs with the multi-layer diag chain in -34..-47 that nailed
# the root cause (online task #196).
--with-myspell-dicts
